    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket failure in AI Studio cloud preview environment
      (function() {
        if (typeof window === 'undefined') return;
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr')) || (typeof url === 'string' && url.includes('vite-hmr'));
            if (isViteHmr) {
              const target = new EventTarget();
              const dummyWs = {
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return dummyWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (typeof a === 'object' && a !== null ? (a.message || JSON.stringify(a)) : String(a))).join(' ');
          if (msg.includes('WebSocket closed without opened') || msg.includes('failed to connect to websocket')) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.includes('WebSocket closed without opened') || event.message.includes('WebSocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
