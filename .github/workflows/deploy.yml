name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Cloud-sync identifiers. Both are public by design — access to data is
      # enforced by Postgres RLS on the Supabase side, not by key secrecy.
      env:
        VITE_SUPABASE_URL: https://ptbhhytyadpobozurxsk.supabase.co
        VITE_SUPABASE_ANON_KEY: sb_publishable_NVwQ6CYVuoNa0spnu25eMQ_ocPAVr7s
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
